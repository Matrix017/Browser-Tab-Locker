<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Tab-locker</title>
</head>

<body class="gradient-background">
    <div class="main-container">
        <!-- State 1: Setup Password -->
        <div class="state1" hidden="true">
            <h2>Setup Locker</h2>
            <p>Enter a password to protect this site.</p>
            <div class="setup-password">
                <div class="password-wrapper">
                    <input type="password" id="passwordInput" placeholder="Create password" autocomplete="off">
                    <span class="toggle-password" data-target="passwordInput">👁️</span>
                </div>
                <button type="submit" id="createPasswordBtn">Protect Site</button>
            </div>
        </div>

        <!-- State 2: Domain Configured -->
        <div class="state2" hidden="true">
            <h2>Tab Status</h2>
            <p id="statusText">Protection is active.</p>
            <div class="controls" id="lockActionContainer">
                <button id="lockNowBtn">🔒 Lock Now</button>
            </div>
            <button id="changePasswordBtn" class="secondary-button">Update Password</button>
            <button id="disable-passwordbtn">Remove Protection</button>
        </div>

        <!-- State 3: Verify Current Password -->
        <div class="state3" hidden="true">
            <h2>Verification</h2>
            <p>Enter your password to continue.</p>
            <div class="setup-password">
                <div class="password-wrapper">
                    <input type="password" id="verifyPasswordInput" placeholder="Current password" autocomplete="off">
                    <span class="toggle-password" data-target="verifyPasswordInput">👁️</span>
                </div>
                <button id="verifyPasswordBtn">Verify</button>
                <button id="cancelVerifyBtn" class="link-button">Cancel</button>
            </div>
        </div>

        <!-- State 4: Disable password protection -->
        <div class="state4" hidden="true">
            <h2>Disable Security</h2>
            <p>Verify password to remove locker.</p>
            <div class="setup-password">
                <div class="password-wrapper">
                    <input type="password" id="disable-passwordsinput" placeholder="Enter password" autocomplete="off">
                    <span class="toggle-password" data-target="disable-passwordsinput">👁️</span>
                </div>
                <button id="disable-passwordverification">Disable Security</button>
                <p hidden="true" id="disabling-status" style="font-size: 13px; margin-top: 10px;"></p>
                <button id="cancelDisableBtn" class="link-button">Cancel</button>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>

</html>
